<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>_ Z Platform</title>

    <style>
        :root {
            --bg: #08080c;
            --card: #14141c;
            --pink: #ec4899;
            --white: #ffffff;
            --muted: #a1a1aa;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: #f5f5f7; font-family: "Segoe UI", system-ui, sans-serif; overflow-x: hidden; min-height: 100vh; }
        button, input { font: inherit; }
        button { border: 0; cursor: pointer; }

        /* SPLASH SCREEN */
        .splash-screen {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at center, rgba(236, 72, 153, 0.16), transparent 45%), var(--bg);
            transition: opacity 0.7s ease, visibility 0.7s ease;
        }
        .splash-screen.hide { opacity: 0; visibility: hidden; pointer-events: none; }
        .brand-logo { color: var(--white); font-size: clamp(4.5rem, 15vw, 9rem); font-weight: 900; letter-spacing: -0.08em; text-shadow: 0 0 25px rgba(236, 72, 153, 0.25); }
        .splash-text { margin-top: 18px; color: var(--muted); font-size: 0.95rem; text-align: center; }

        /* MAIN APP */
        .main-screen { position: relative; display: flex; flex-direction: column; min-height: 100vh; }
        .top-bar { width: 100%; height: 80px; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; border-bottom: 1px solid var(--border); }
        .small-logo { color: var(--white); font-size: 1.5rem; font-weight: 900; }
        .user-status { display: flex; align-items: center; gap: 12px; }
        .user-email { font-size: 0.9rem; color: var(--pink); font-weight: 600; }
        .login-button { padding: 11px 22px; color: var(--white); background: rgba(236, 72, 153, 0.12); border: 1px solid rgba(236, 72, 153, 0.35); border-radius: 12px; transition: 0.3s; }
        .login-button:hover { background: var(--pink); }

        .main-content { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 30px 20px; }
        .welcome-section { text-align: center; margin-bottom: 25px; }
        .welcome-section h1 { font-size: clamp(1.7rem, 4vw, 2.7rem); font-weight: 800; }
        .welcome-section p { margin-top: 8px; color: var(--muted); }

        /* UPLOAD AREA - الدائرة بالشكل الأصلي بالظبط */
        .upload-area {
            width: min(300px, 80vw); aspect-ratio: 1 / 1;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
            border-radius: 50%; background: radial-gradient(circle at center, rgba(236, 72, 153, 0.08), rgba(20, 20, 28, 0.95) 70%);
            border: 2px dashed rgba(236, 72, 153, 0.45); cursor: pointer; transition: 0.3s ease; text-align: center; padding: 20px;
        }
        .upload-area:hover { transform: scale(1.02); border-color: var(--pink); }
        .upload-text-main { color: var(--white); font-weight: 700; font-size: 1.1rem; }
        .upload-text-or { color: var(--muted); font-size: 0.85rem; }

        /* SELECTED PROJECT PREVIEW */
        .project-preview { width: min(450px, 92vw); margin-top: 25px; padding: 18px; display: flex; align-items: center; justify-content: space-between; background: var(--card); border: 1px solid var(--border); border-radius: 16px; }
        .project-info { display: flex; flex-direction: column; gap: 4px; }
        .project-label { color: var(--muted); font-size: 0.75rem; letter-spacing: 0.05em; font-weight: 700; text-transform: uppercase; }
        .project-name { color: var(--white); font-weight: 800; font-size: 1rem; }
        .deploy-button { padding: 12px 26px; color: var(--white); background: var(--pink); border-radius: 12px; font-weight: 800; font-size: 1rem; }
        .deploy-button:disabled { opacity: 0.6; cursor: not-allowed; }

        /* RESULT BOX - نفس تصميم الصورة الأصلية بالضبط */
        .deploy-result { margin-top: 20px; text-align: center; background: #0c0c12; padding: 22px; border-radius: 16px; border: 1px solid var(--pink); width: min(450px, 92vw); }
        .success-message { color: #86efac; font-weight: 800; font-size: 1.1rem; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .live-link { color: var(--pink); font-size: 1.05rem; font-weight: 800; text-decoration: underline; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; word-break: break-all; }
        .live-link:hover { opacity: 0.85; }

        /* AUTH MODAL */
        .modal { position: fixed; inset: 0; z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .modal[hidden] { display: none; }
        .modal-overlay { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(8px); }
        .login-card { width: min(380px, 100%); position: relative; z-index: 1; padding: 30px; text-align: center; background: #121219; border: 1px solid var(--border); border-radius: 20px; }
        .close-button { position: absolute; top: 12px; right: 15px; color: var(--muted); background: transparent; font-size: 1.5rem; }
        .auth-form { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        .auth-input { width: 100%; padding: 12px; background: #1a1a24; border: 1px solid var(--border); border-radius: 8px; color: var(--white); outline: none; }
        .auth-submit { width: 100%; padding: 12px; background: var(--pink); color: var(--white); font-weight: 700; border-radius: 8px; }
        .divider { margin: 15px 0; color: var(--muted); font-size: 0.8rem; }
        .google-login-button { width: 100%; padding: 11px; display: flex; align-items: center; justify-content: center; gap: 10px; color: #18181b; background: var(--white); border-radius: 8px; font-weight: 800; }
        .auth-toggle { margin-top: 15px; font-size: 0.85rem; color: var(--muted); cursor: pointer; }
        .auth-toggle span { color: var(--pink); font-weight: 700; }
    </style>
</head>

<body>

    <!-- Splash Screen -->
    <section id="splash-screen" class="splash-screen">
        <div class="splash-content">
            <div class="brand-logo">_ Z</div>
            <p class="splash-text">Built by Ziad. Powered by Firebase.</p>
        </div>
    </section>

    <!-- Main Screen -->
    <main class="main-screen">
        <header class="top-bar">
            <span class="small-logo">_ Z</span>
            <div class="user-status">
                <span id="user-display" class="user-email"></span>
                <button id="login-button" class="login-button" type="button">Sign in</button>
            </div>
        </header>

        <section class="main-content">
            <div class="welcome-section">
                <h1>Ready when you are, Ziad.</h1>
                <p>Upload your project and deploy it.</p>
            </div>

            <!-- الدائرة بالشكل والنص الأصلي -->
            <div id="upload-area" class="upload-area">
                <span class="upload-text-main">Browse files to upload</span>
                <span class="upload-text-or">or</span>
                <span class="upload-text-main">or choose a folder</span>
            </div>

            <section id="project-preview" class="project-preview" hidden>
                <div class="project-info">
                    <span class="project-label">SELECTED PROJECT</span>
                    <span id="project-name" class="project-name">calculator.html</span>
                </div>
                <button id="deploy-button" class="deploy-button" type="button">Deploy</button>
            </section>

            <!-- نتيجة الـ Deploy بالشكل اللطيف والرابط المباشر -->
            <section id="deploy-result" class="deploy-result" hidden>
                <div class="success-message">🎉 Your project is live!</div>
                <a id="open-site-link" class="live-link" target="_blank" rel="noopener noreferrer">Open deployed site ↗</a>
            </section>
        </section>

        <input id="file-input" type="file" accept=".html" hidden>
    </main>

    <!-- Modal التسجيل -->
    <div id="login-modal" class="modal" hidden>
        <div class="modal-overlay"></div>
        <div class="login-card">
            <button id="close-login" class="close-button" type="button">×</button>
            <h2 id="modal-title">Sign In</h2>
            
            <form id="auth-form" class="auth-form">
                <input id="auth-email" class="auth-input" type="email" placeholder="Email address" required>
                <input id="auth-password" class="auth-input" type="password" placeholder="Password" required>
                <button id="auth-submit" class="auth-submit" type="submit">Sign In</button>
            </form>

            <div class="divider">OR</div>

            <button id="google-login" class="google-login-button" type="button">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                Continue with Google
            </button>

            <p id="auth-toggle" class="auth-toggle">Don't have an account? <span>Sign Up</span></p>
        </div>
    </div>

    <!-- Firebase SDK Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            signInWithPopup, 
            GoogleAuthProvider, 
            onAuthStateChanged,
            signOut 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBlJqZTaTOt2FqvSN4VlMKqI4BtELlzy5s",
            authDomain: "ziad-app-414b7.firebaseapp.com",
            projectId: "ziad-app-414b7",
            storageBucket: "ziad-app-414b7.firebasestorage.app",
            messagingSenderId: "418478296000",
            appId: "1:418478296000:web:68be95f3cf491eae0ed625",
            measurementId: "G-01N4SMDGX0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        const splashScreen = document.getElementById("splash-screen");
        const loginButton = document.getElementById("login-button");
        const userDisplay = document.getElementById("user-display");
        const loginModal = document.getElementById("login-modal");
        const closeLogin = document.getElementById("close-login");
        const modalOverlay = document.querySelector(".modal-overlay");
        
        const authForm = document.getElementById("auth-form");
        const authEmail = document.getElementById("auth-email");
        const authPassword = document.getElementById("auth-password");
        const authSubmit = document.getElementById("auth-submit");
        const authToggle = document.getElementById("auth-toggle");
        const modalTitle = document.getElementById("modal-title");
        const googleLogin = document.getElementById("google-login");

        const uploadArea = document.getElementById("upload-area");
        const fileInput = document.getElementById("file-input");
        const projectPreview = document.getElementById("project-preview");
        const projectName = document.getElementById("project-name");
        const deployButton = document.getElementById("deploy-button");
        const deployResult = document.getElementById("deploy-result");
        const openSiteLink = document.getElementById("open-site-link");

        let isSignUp = false;
        let selectedFile = null;
        let fileContent = "";

        setTimeout(() => splashScreen.classList.add("hide"), 1200);

        loginButton.addEventListener("click", () => {
            if (auth.currentUser) {
                signOut(auth);
            } else {
                loginModal.hidden = false;
            }
        });
        closeLogin.addEventListener("click", () => loginModal.hidden = true);
        modalOverlay.addEventListener("click", () => loginModal.hidden = true);

        authToggle.addEventListener("click", () => {
            isSignUp = !isSignUp;
            modalTitle.textContent = isSignUp ? "Sign Up" : "Sign In";
            authSubmit.textContent = isSignUp ? "Create Account" : "Sign In";
            authToggle.innerHTML = isSignUp 
                ? 'Already have an account? <span>Sign In</span>' 
                : 'Don\'t have an account? <span>Sign Up</span>';
        });

        authForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            try {
                if (isSignUp) {
                    await createUserWithEmailAndPassword(auth, authEmail.value, authPassword.value);
                } else {
                    await signInWithEmailAndPassword(auth, authEmail.value, authPassword.value);
                }
                loginModal.hidden = true;
            } catch (error) {
                alert("Auth Error: " + error.message);
            }
        });

        googleLogin.addEventListener("click", async () => {
            try {
                await signInWithPopup(auth, googleProvider);
                loginModal.hidden = true;
            } catch (error) {
                alert("Google Sign-In Error: " + error.message);
            }
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                userDisplay.textContent = user.email.split('@')[0];
                loginButton.textContent = "Sign Out";
            } else {
                userDisplay.textContent = "";
                loginButton.textContent = "Sign in";
            }
        });

        uploadArea.addEventListener("click", () => fileInput.click());
        
        fileInput.addEventListener("change", () => {
            if (fileInput.files.length) {
                selectedFile = fileInput.files[0];
                projectName.textContent = selectedFile.name;
                
                const reader = new FileReader();
                reader.onload = (e) => {
                    fileContent = e.target.result;
                    projectPreview.hidden = false;
                    deployResult.hidden = true;
                };
                reader.readAsText(selectedFile);
            }
        });

        // الـ Deploy وإنشاء الرابط الحقيقي المباشر
        deployButton.addEventListener("click", async () => {
            if (!fileContent) return;

            deployButton.textContent = "Deploying...";
            deployButton.disabled = true;

            try {
                await addDoc(collection(db, "projects"), {
                    name: selectedFile.name,
                    user: auth.currentUser ? auth.currentUser.email : "Anonymous",
                    createdAt: new Date()
                });

                // إنتاج رابط مباشر للملف يفتح فورا
                const blob = new Blob([fileContent], { type: 'text/html' });
                const liveUrl = URL.createObjectURL(blob);

                openSiteLink.href = liveUrl;
                deployResult.hidden = false;
            } catch (err) {
                alert("Deployment failed: " + err.message);
            } finally {
                deployButton.textContent = "Deploy";
                deployButton.disabled = false;
            }
        });
    </script>
</body>
</html>
