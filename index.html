<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>_ Z Platform</title>

    <style>
        :root {
            --bg: #08080c;
            --card: #14141c;
            --pink: #ec4899;
            --white: #ffffff;
            --muted: #a1a1aa;
            --border: rgba(255,255,255,.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: #f5f5f7;
            font-family: "Segoe UI", system-ui, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        button,
        input {
            font: inherit;
        }

        button {
            border: 0;
            cursor: pointer;
        }

        .splash-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(
                    circle at center,
                    rgba(236,72,153,.16),
                    transparent 45%
                ),
                var(--bg);
            transition: .7s;
        }

        .splash-screen.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .brand-logo {
            color: white;
            font-size: clamp(4.5rem,15vw,9rem);
            font-weight: 900;
            letter-spacing: -.08em;
            text-shadow: 0 0 25px rgba(236,72,153,.25);
        }

        .splash-text {
            margin-top: 18px;
            color: var(--muted);
            text-align: center;
        }

        .main-screen {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            border-bottom: 1px solid var(--border);
        }

        .small-logo {
            font-size: 1.5rem;
            font-weight: 900;
        }

        .user-status {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-email {
            color: var(--pink);
            font-size: .9rem;
            font-weight: 600;
        }

        .login-button {
            padding: 11px 22px;
            color: white;
            background: rgba(236,72,153,.12);
            border: 1px solid rgba(236,72,153,.35);
            border-radius: 12px;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
        }

        .welcome-section {
            text-align: center;
            margin-bottom: 25px;
        }

        .welcome-section h1 {
            font-size: clamp(1.7rem,4vw,2.7rem);
            font-weight: 800;
        }

        .welcome-section p {
            margin-top: 8px;
            color: var(--muted);
        }

        .upload-area {
            width: min(300px,80vw);
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 20px;
            text-align: center;
            border-radius: 50%;
            background:
                radial-gradient(
                    circle at center,
                    rgba(236,72,153,.08),
                    rgba(20,20,28,.95) 70%
                );
            border: 2px dashed rgba(236,72,153,.45);
            transition: .3s;
        }

        .upload-area:hover {
            transform: scale(1.02);
            border-color: var(--pink);
        }

        .upload-text-main {
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .upload-text-or {
            color: var(--muted);
            font-size: .85rem;
        }

        .project-preview,
        .deploy-result {
            width: min(450px,92vw);
            margin-top: 25px;
            padding: 18px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
        }

        .project-preview {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .project-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .project-label {
            color: var(--muted);
            font-size: .75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .project-name {
            color: white;
            font-weight: 800;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .deploy-button {
            padding: 12px 26px;
            color: white;
            background: var(--pink);
            border-radius: 12px;
            font-weight: 800;
            white-space: nowrap;
        }

        .deploy-button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .deploy-result {
            text-align: center;
            border-color: var(--pink);
        }

        .success-message {
            color: #86efac;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .url-box {
            display: flex;
            gap: 8px;
        }

        .url-input {
            flex: 1;
            min-width: 0;
            padding: 10px;
            color: var(--pink);
            background: #181824;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
        }

        .copy-btn {
            padding: 10px 14px;
            color: white;
            background: var(--pink);
            border-radius: 8px;
            font-weight: 700;
        }

        .modal {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal[hidden] {
            display: none;
        }

        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,.75);
            backdrop-filter: blur(8px);
        }

        .login-card {
            width: min(380px,100%);
            position: relative;
            z-index: 1;
            padding: 30px;
            text-align: center;
            background: #121219;
            border: 1px solid var(--border);
            border-radius: 20px;
        }

        .close-button {
            position: absolute;
            top: 12px;
            right: 15px;
            color: var(--muted);
            background: transparent;
            font-size: 1.5rem;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .auth-input {
            width: 100%;
            padding: 12px;
            color: white;
            background: #1a1a24;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
        }

        .auth-submit,
        .google-login-button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
        }

        .auth-submit {
            color: white;
            background: var(--pink);
        }

        .google-login-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #18181b;
            background: white;
        }

        .divider {
            margin: 15px 0;
            color: var(--muted);
            font-size: .8rem;
        }

        .auth-toggle {
            margin-top: 15px;
            color: var(--muted);
            font-size: .85rem;
            cursor: pointer;
        }

        .auth-toggle span {
            color: var(--pink);
            font-weight: 700;
        }
    </style>
</head>

<body>

<section id="splash-screen" class="splash-screen">
    <div>
        <div class="brand-logo">_ Z</div>
        <p class="splash-text">Built by Ziad. Powered by Firebase.</p>
    </div>
</section>

<main class="main-screen">

    <header class="top-bar">
        <span class="small-logo">_ Z</span>

        <div class="user-status">
            <span id="user-display" class="user-email"></span>
            <button id="login-button" class="login-button">
                Sign in
            </button>
        </div>
    </header>

    <section class="main-content">

        <div class="welcome-section">
            <h1>Ready when you are, Ziad.</h1>
            <p>Upload your project and deploy it.</p>
        </div>

        <div id="upload-area" class="upload-area">
            <span class="upload-text-main">
                Browse files to upload
            </span>

            <span class="upload-text-or">or</span>

            <span class="upload-text-main">
                choose multiple files
            </span>
        </div>

        <section id="project-preview" class="project-preview" hidden>

            <div class="project-info">
                <span class="project-label">
                    SELECTED PROJECT
                </span>

                <span id="project-name" class="project-name">
                    No files selected
                </span>
            </div>

            <button id="deploy-button" class="deploy-button">
                Deploy
            </button>

        </section>

        <section id="deploy-result" class="deploy-result" hidden>

            <div class="success-message">
                🎉 Your project is live!
            </div>

            <div class="url-box">
                <input
                    id="generated-url"
                    class="url-input"
                    type="text"
                    readonly
                >

                <button id="copy-url-btn" class="copy-btn">
                    Copy 📋
                </button>
            </div>

        </section>

    </section>

    <input
        id="file-input"
        type="file"
        multiple
        hidden
    >

</main>

<div id="login-modal" class="modal" hidden>

    <div class="modal-overlay"></div>

    <div class="login-card">

        <button id="close-login" class="close-button">
            ×
        </button>

        <h2 id="modal-title">Sign In</h2>

        <form id="auth-form" class="auth-form">

            <input
                id="auth-email"
                class="auth-input"
                type="email"
                placeholder="Email address"
                required
            >

            <input
                id="auth-password"
                class="auth-input"
                type="password"
                placeholder="Password"
                required
            >

            <button
                id="auth-submit"
                class="auth-submit"
                type="submit"
            >
                Sign In
            </button>

        </form>

        <div class="divider">OR</div>

        <button
            id="google-login"
            class="google-login-button"
        >
            Continue with Google
        </button>

        <p id="auth-toggle" class="auth-toggle">
            Don't have an account?
            <span>Sign Up</span>
        </p>

    </div>
</div>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    signInWithPopup,
    GoogleAuthProvider,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyBlJqZTaTOt2FqvSN4VlMKqI4BtELlzy5s",
    authDomain: "ziad-app-414b7.firebaseapp.com",
    projectId: "ziad-app-414b7",
    storageBucket: "ziad-app-414b7.firebasestorage.app",
    messagingSenderId: "418478296000",
    appId: "1:418478296000:web:68be95f3cf491eae0ed625",
    measurementId: "G-01N4SMDGX0"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const googleProvider = new GoogleAuthProvider();

const splashScreen =
    document.getElementById("splash-screen");

const loginButton =
    document.getElementById("login-button");

const userDisplay =
    document.getElementById("user-display");

const loginModal =
    document.getElementById("login-modal");

const closeLogin =
    document.getElementById("close-login");

const modalOverlay =
    document.querySelector(".modal-overlay");

const authForm =
    document.getElementById("auth-form");

const authEmail =
    document.getElementById("auth-email");

const authPassword =
    document.getElementById("auth-password");

const authSubmit =
    document.getElementById("auth-submit");

const authToggle =
    document.getElementById("auth-toggle");

const modalTitle =
    document.getElementById("modal-title");

const googleLogin =
    document.getElementById("google-login");

const uploadArea =
    document.getElementById("upload-area");

const fileInput =
    document.getElementById("file-input");

const projectPreview =
    document.getElementById("project-preview");

const projectName =
    document.getElementById("project-name");

const deployButton =
    document.getElementById("deploy-button");

const deployResult =
    document.getElementById("deploy-result");

const generatedUrl =
    document.getElementById("generated-url");

const copyUrlBtn =
    document.getElementById("copy-url-btn");

let isSignUp = false;
let selectedFiles = [];

setTimeout(() => {
    splashScreen.classList.add("hide");
}, 1200);

loginButton.addEventListener("click", async () => {

    if (auth.currentUser) {
        await signOut(auth);
        return;
    }

    loginModal.hidden = false;
});

closeLogin.addEventListener("click", () => {
    loginModal.hidden = true;
});

modalOverlay.addEventListener("click", () => {
    loginModal.hidden = true;
});

authToggle.addEventListener("click", () => {

    isSignUp = !isSignUp;

    modalTitle.textContent =
        isSignUp ? "Sign Up" : "Sign In";

    authSubmit.textContent =
        isSignUp ? "Create Account" : "Sign In";

    authToggle.innerHTML = isSignUp
        ? "Already have an account? <span>Sign In</span>"
        : "Don't have an account? <span>Sign Up</span>";
});

authForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    try {

        if (isSignUp) {

            await createUserWithEmailAndPassword(
                auth,
                authEmail.value,
                authPassword.value
            );

        } else {

            await signInWithEmailAndPassword(
                auth,
                authEmail.value,
                authPassword.value
            );
        }

        loginModal.hidden = true;

    } catch (error) {

        alert("Auth Error: " + error.message);
    }
});

googleLogin.addEventListener("click", async () => {

    try {

        await signInWithPopup(
            auth,
            googleProvider
        );

        loginModal.hidden = true;

    } catch (error) {

        alert("Google Sign-In Error: " + error.message);
    }
});

onAuthStateChanged(auth, (user) => {

    if (user) {

        userDisplay.textContent =
            user.email
                ? user.email.split("@")[0]
                : "User";

        loginButton.textContent =
            "Sign Out";

    } else {

        userDisplay.textContent = "";
        loginButton.textContent = "Sign in";
    }
});

uploadArea.addEventListener("click", () => {
    fileInput.click();
});

fileInput.addEventListener("change", async () => {

    if (!fileInput.files.length) {
        return;
    }

    selectedFiles =
        Array.from(fileInput.files);

    projectName.textContent =
        selectedFiles.length === 1
            ? selectedFiles[0].name
            : `${selectedFiles.length} files selected`;

    projectPreview.hidden = false;
    deployResult.hidden = true;
});

deployButton.addEventListener("click", async () => {

    if (!selectedFiles.length) {
        alert("Please select files first.");
        return;
    }

    if (!auth.currentUser) {

        alert("Please sign in first.");

        loginModal.hidden = false;

        return;
    }

    deployButton.textContent =
        "Deploying...";

    deployButton.disabled = true;

    deployResult.hidden = true;

    try {

        const files = [];

        for (const file of selectedFiles) {

            const content =
                await file.text();

            files.push({
                path: file.name,
                data: content
            });
        }

        const response =
            await fetch("/api/deploy", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    files
                })
            });

        const result =
            await response.json();

        if (!response.ok) {

            throw new Error(
                result.error ||
                "Deployment failed."
            );
        }

        if (!result.url) {

            throw new Error(
                "Vercel did not return a deployment URL."
            );
        }

        generatedUrl.value =
            result.url;

        deployResult.hidden = false;

    } catch (error) {

        console.error(error);

        alert(
            "Deployment failed:\n" +
            error.message
        );

    } finally {

        deployButton.textContent =
            "Deploy";

        deployButton.disabled =
            false;
    }
});

copyUrlBtn.addEventListener("click", async () => {

    try {

        await navigator.clipboard.writeText(
            generatedUrl.value
        );

        copyUrlBtn.textContent =
            "Copied! ✅";

        setTimeout(() => {

            copyUrlBtn.textContent =
                "Copy 📋";

        }, 2000);

    } catch {

        generatedUrl.select();
        document.execCommand("copy");

        copyUrlBtn.textContent =
            "Copied! ✅";
    }
});

</script>

</body>
</html>
